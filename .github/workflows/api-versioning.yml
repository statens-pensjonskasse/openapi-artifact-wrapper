name: Reusable workflow for API versioning (git tag versus API version)

on:
  workflow_call:
    outputs:
      apiversion:
        description: version of API
        value: ${{ jobs.versioning.outputs.apiversion }}
      released:
        description: true if a release tag matching API version was found
        value: ${{ jobs.versioning.outputs.released }}

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      apiversion: ${{ steps.apiversion.outputs.apiversion }}
      released: ${{ steps.goahead.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find version in API specification
        id: apiversion
        run: |
          API_SPEC=$( jq -er '.artifactName' openapi-artifact.json ).json
          API_VERSION=$( jq -er '.info.version' $API_SPEC )
          if [ -z "$API_VERSION" ] || [ "$API_VERSION" = "{}" ]; then
            echo "::error::Could not read version from API specification"
            exit 1
          fi
          echo "apiversion=$API_VERSION" >> $GITHUB_OUTPUT

      - name: Check for release tag matching API version
        id: goahead
        run: |
          git fetch --tags
          LAST_GIT_TAG=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$LAST_GIT_TAG" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            LAST_RELEASE_VERSION=$(echo "$LAST_GIT_TAG" | awk -F. '{print $1 "." $2 "." $3+1}')
          fi
          if [ "${{ steps.apiversion.outputs.apiversion }}" = "$LAST_RELEASE_VERSION" ]; then
            echo "::info::Terminate release because API specification version ${{ steps.apiversion.outputs.apiversion }} is found in git tag $LAST_RELEASE_VERSION."
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"

