name: Reusable workflow for API versioning (git tag versus API version)

on:
  workflow_call:
    inputs:
      api-spec-json:
        description: Open API specification file in json - version is used to tag, release and publish.
        type: string
        required: true
    outputs:
      apiversion:
        description: version of API
        value: ${{ jobs.versioning.outputs.apiversion }}
      released:
        description: true if a release tag matching API version was found
        value: ${{ jobs.versioning.outputs.released }}

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      apiversion: ${{ steps.apiversion.outputs.apiversion }}
      release: ${{ steps.goahead.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find last release tag
        id: gitversion
        run: |
          git fetch --tags
          LAST_GIT_TAG=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$LAST_GIT_TAG" ]; then
            LAST_RELEASE_VERSION="0.0.0"
          else
            LAST_RELEASE_VERSION=$(echo "$LAST_GIT_TAG" | awk -F. '{print $1 "." $2 "." $3+1}')
          fi
          echo "gitversion=$LAST_RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Find version in API specification
        id: apiversion
        run: |
          OPENAPI_SPEC_JSON=$( jq -er '.localJson' openapi-artifact.json )
          # OPENAPI_SPEC_JSON should be same as input, but I prefer to let caller specify
          API_VERSION=$( jq -er '.info.version' ${{ inputs.api-spec-json }} )
          if [ -z "$API_VERSION" ] || [ "$API_VERSION" = "{}" ]; then
            echo "::error::Could not read version from {{ inputs.api-spec-json }}"
            exit 1
          fi
          echo "apiversion=$API_VERSION" >> $GITHUB_OUTPUT

      - name: Check for git tag matching API version
        id: goahead
        run: |
          if [ "${{ steps.apiversion.outputs.apiversion }}" = "${{ steps.gitversion.outputs.gitversion }}" ]; then
            echo "::info::Terminate release because API specification version ${{ steps.apiversion.outputs.apiversion }} is same as git version ${{ steps.gitversion.outputs.gitversion }}."
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"

