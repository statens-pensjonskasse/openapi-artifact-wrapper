name: Reusable workflow for API versioning (git tag versus API version)

on:
  workflow_call:
    inputs:
      # Little reason to override inputs below:
      # no code should be compiled or run with proper use of workflow
      # auth is default GITHUB_TOKEN, so github packages will work, other registries might balk
      npm-registry-url:
        description: npm registry to publish to
        type: string
        default: https://npm.pkg.github.com
      github-org:
        description: GitHub organization
        type: string
        default: '@statens-pensjonskasse'
      node-version:
        description: Node version used
        type: string
        default: '24'
    outputs:
      apiversion:
        description: version of API
        value: ${{ jobs.versioning.outputs.apiversion }}
      released:
        description: true if a release tag matching API version was found
        value: ${{ jobs.versioning.outputs.released }}

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      apiversion: ${{ steps.apiversion.outputs.apiversion }}
      released: ${{ steps.goahead.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: # node is preinstalled on ubuntu-latest, but "npm ci" needs setup-node to configure registry and auth
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.npm-registry-url }}
          scope: ${{ inputs.github-org }}

      - name: Find version in API specification
        id: apiversion
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm install
          API_VERSION=$( node ./node_modules/.bin/openapi-artifact-cli api-version )
          # API_VERSION=$( jq -er '.info.version' ${{ inputs.api-spec-json }} )
          if [ -z "$API_VERSION" ] || [ "$API_VERSION" = "{}" ]; then
            echo "::error::Could not read version from API specification"
            exit 1
          fi
          echo "apiversion=$API_VERSION" >> $GITHUB_OUTPUT

      - name: Check for release tag matching API version
        id: goahead
        run: |
          git fetch --tags
          LAST_GIT_TAG=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$LAST_GIT_TAG" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            LAST_RELEASE_VERSION=$(echo "$LAST_GIT_TAG" | awk -F. '{print $1 "." $2 "." $3+1}')
          fi
          if [ "${{ steps.apiversion.outputs.apiversion }}" = "$LAST_RELEASE_VERSION" ]; then
            echo "::info::Terminate release because API specification version ${{ steps.apiversion.outputs.apiversion }} is found in git tag $LAST_RELEASE_VERSION."
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"

