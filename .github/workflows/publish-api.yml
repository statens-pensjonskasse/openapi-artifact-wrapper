name: Reusable workflow for API publishing = create release, deploy mvn artifact, publish npm packages

on:
  workflow_call:
    inputs:
      release-version:
        description: Version to publish.
        type: string
        required: true
      tbv-script:
        description: Npm script that tests, builds and verifies readiness for release, runs after npm install
        type: string
        default: npm run tbv
      public-access:
        description: npm publish with option "--access public" if true.
        type: string
        required: true
      # Little reason to override inputs below:
      # no code should be compiled or run with proper use of workflow
      npm-registry-url:
        description: npm registry to publish to
        type: string
        default: https://npm.pkg.github.com
      github-org:
        description: GitHub organization
        type: string
        default: '@statens-pensjonskasse'
      node-version:
        description: Node version used
        type: string
        default: '26'
      java-version:
        description: Java version used
        type: string
        default: '25'
      java-distribution:
        description: Java distribution used
        type: string
        default: 'temurin'

jobs:

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.verify.outputs.publish }}
    steps:
      - id: verify
        run: |
          API_VERSION=${{ inputs.release-version }}
          if ! [[ "$API_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 2.2.0)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$API_VERSION" > /dev/null; then
            echo "::notice::Release tag $API_VERSION published, done"
            exit 0
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release tag $API_VERSION not found, may release"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # node is preinstallled on ubuntu, but we need to reinstall to set up registry and org
      - uses: actions/setup-node@v7
        with: # node is preinstalled on ubuntu-latest, but publish needs setup-node to configure registry and auth
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.npm-registry-url }}
          scope: ${{ inputs.github-org }}
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - name: run tbv-script, abort if dirty woorking tree
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_FOR_PACKAGES_ACCESS }} # rights to read organization packages
        run: |
          npm ci
          ${{ inputs.tbv-script }}
          # abort before releasing if dirty files (untracked files are ignored)
          dirty=$(git status --porcelain --untracked-files=no)
          if [ -n "$dirty" ]; then
            echo "::error::Working tree is dirty after ${{ inputs.tbv-script }}, aborting release."
            echo "$dirty"
            git --no-pager diff
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release-version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish public node package
        if: inputs.public-access == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # rights to write repo package, but not read organization dependencies
        run: npm publish --access public

      - name: Publish internal node package
        if: inputs.public-access != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # rights to write repo package, but not read organization dependencies
        run: npm publish

      - name: Deploy Maven artifact
        env:
          GITHUB_TOKEN: ${{ github.token }} # rights to deploy repo artifact, but not read organization dependencies
        run: mvn deploy
