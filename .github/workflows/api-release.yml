name: Reusable workflow for releasing API (if needed)

on:
  workflow_call:
    inputs:
      # Little reason to override inputs below:
      # no code should be compiled or run with proper use of workflow
      # auth is default GITHUB_TOKEN, so github packages will work, other registries might balk
      npm-registry-url:
        description: npm registry to publish to
        type: string
        default: https://npm.pkg.github.com
      github-org:
        description: GitHub organization
        type: string
        default: '@statens-pensjonskasse'
      node-version:
        description: Node version used
        type: string
        default: '24'
    outputs:
      apiversion:
        description: version of API
        value: ${{ jobs.versioning.outputs.apiversion }}
      release-performed:
        description: true if a new release was made, false otherwise
        value: ${{ jobs.release-result.outputs.released }}

jobs:
  versioning:
    uses: ./.github/workflows/api-versioning.yml
    with:
      npm-registry-url: ${{ inputs.npm-registry-url }}
      node-version: ${{ inputs.node-version }}
      github-org: ${{ inputs.github-org }}
  release:
    runs-on: ubuntu-latest
    needs: [ versioning ]
    permissions:
      contents: write
    if: needs.versioning.outputs.released == 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.versioning.outputs.apiversion }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-result:
    runs-on: ubuntu-latest
    needs: [ release ]
    if: ${{ always() }}
    outputs:
      released: ${{ steps.result.outputs.released }}
    steps:
      - name: Report release result
        id: result
        env:
          RELEASE_SUCCEEDED: ${{ needs.release.result == 'success' }}
        run: echo "released=$RELEASE_SUCCEEDED" >> "$GITHUB_OUTPUT"
