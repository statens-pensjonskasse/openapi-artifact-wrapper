name: Reusable workflow builds API with node script, then commits and pushes any files modified by build

on:
  workflow_call:
    inputs:
      tbv-script:
        description: Npm script that tests, builds and verifies readiness for release, runs after npm install
        type: string
        default: 'npm run tbv'
      commit-message:
        description: Commit message for files updated by tbv-script.
        type: string
        default: 'chore: update project files to API version'
      # Little reason to override inputs below:
      node-version:
        description: Node version used
        type: string
        default: '26'
      npm-registry-url:
        description: npm registry to get dependencies from
        type: string
        default: https://npm.pkg.github.com
      github-org:
        description: GitHub organization
        type: string
        default: '@statens-pensjonskasse'
      runner-tag:
        description: workflow should run on...
        type: string
        default: 'ubuntu-latest'

jobs:
  update-project:
    runs-on: ${{ inputs.runner-tag }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # node is preinstallled on ubuntu, but we need to reinstall to set up registry and org
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.npm-registry-url }}
          scope: ${{ inputs.github-org }}

      - name: Run script ${{ inputs.build-script }}
        env:
          # PAT_FOR_PACKAGES_ACCESS for install and build - has rights to read org packages, but not write this repo or its packages
          NODE_AUTH_TOKEN: ${{ secrets.PAT_FOR_PACKAGES_ACCESS }}
        run: |
          npm install # ci will fail if this is a renovate PR
          ${{ inputs.tbv-script }}
          git status
          git add -A

      - name: Commit and push changes
        uses: statens-pensjonskasse/gha-create-signed-commit@7b9e477ae72b66627fb37db6b841f0e31d3d965e # v0.1.5
        with:
          # GITHUB_TOKEN for commit, push, deploy - has rights to write this repo and its packages, but not rights to read org packages
          token: ${{ secrets.GITHUB_TOKEN }}
          message: ${{ inputs.commit-message }}
          fail-on-no-changes: false
          push: true
